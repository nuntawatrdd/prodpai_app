name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # ป้องกัน Browser เทสต์ค้างตามที่ README แนะนำ
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests (Unit, Static, E2E)
        run: npm test

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Run Semgrep (JS, Docker, Secrets)
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/javascript
            p/dockerfile
            p/secrets

      - name: Run Trivy FS scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 1 # บังคับพังถ้าเจอ CRITICAL/HIGH
          severity: 'CRITICAL,HIGH'

  build-scan-push:
    needs: [test, security]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Load config.env
        # อ่านจากโฟลเดอร์ .github/config.env ตามโครงสร้าง Directory
        run: grep -v '^#' .github/config.env | grep -v '^$' >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG \
            -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest .

      # Smoke Test: ลองรัน Container จริงและยิง Curl ทดสอบก่อน Push (ตาม README)
      - name: Smoke Test (/health and /)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker run -d --name smoke-test -p 8080:8080 $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          sleep 3
          curl -f -i http://localhost:8080/health
          curl -f -I http://localhost:8080/
          docker rm -f smoke-test

      - name: Run Trivy Image scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}'
          format: 'table'
          exit-code: 0
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      # เงื่อนไข: ถ้าเป็น Pull Request จะสแกนอย่างเดียว ไม่ดันขึ้น AWS (ตาม README)
      - name: Push Image to ECR
        if: github.event_name != 'pull_request'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest